/* priority deadlines */
.mx-prio{display:inline-block;font:600 10.5px/1.5 var(--mono);color:var(--bg);background:var(--l7);padding:0 4px;margin-right:6px;vertical-align:1px}
.mx-prsel select{font-size:13px;border:1px solid var(--g3);background:var(--surface);color:var(--ink);padding:1px 4px}

/* Library (library.js; Figma "M7 Library — shelf first"): index and search on the left, the shelf as a cover flow */
html:not(.phone) .lb{display:grid;grid-template-columns:250px 1fr;gap:40px;margin-top:22px}
html:not(.phone) .lb-q{display:flex;align-items:center;gap:8px;border:1px solid var(--g3);padding:0 10px;height:34px;color:var(--ink-3);background:var(--bg)}
html:not(.phone) .lb-q input{flex:1;border:0;background:transparent;font-size:13px;line-height:1;font-family:inherit;color:var(--ink);outline:0;min-width:0}
html:not(.phone) .lb-q input::placeholder{color:var(--g5)}
html:not(.phone) .lb-q:focus-within{border-color:var(--ink)}
html:not(.phone) .lb-q .mono{font-size:10px;color:var(--g5)}
html:not(.phone) .lb-ix{margin-top:14px;max-height:calc(100vh - 290px);overflow:auto}
html:not(.phone) .lb-ch{display:flex;justify-content:space-between;width:100%;padding:7px 0;border:0;border-bottom:1px solid var(--g2);background:none;font-size:14px;line-height:1.3;font-family:inherit;color:var(--ink);text-align:left;cursor:pointer;gap:10px}
html:not(.phone) .lb-ch>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html:not(.phone) .lb-ch .mono{flex:none}
html:not(.phone) .lb-ch.on{font-weight:600;border-bottom:0}
html:not(.phone) .lb-ch .mono{font-size:11px;font-weight:400;color:var(--ink-3)}
html:not(.phone) .lb-cl{padding:2px 0 8px;border-bottom:1px solid var(--g2)}
html:not(.phone) .lb-row{display:block;width:100%;padding:3px 8px 3px 12px;border:0;background:none;font-size:12.5px;line-height:1.4;font-family:inherit;color:var(--ink-2);text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
html:not(.phone) .lb-row.st{color:var(--ink)}
html:not(.phone) .lb-row.st::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:3px;background:var(--l6)}
html:not(.phone) .lb-row.sel{background:var(--l3);color:var(--ink);font-weight:500}
html:not(.phone) .lb-row:hover{background:var(--l1)}
html:not(.phone) .lb-main{min-width:0}
html:not(.phone) .lb-shelf{position:relative;overflow:hidden}
html:not(.phone) .lb-shelf::before,html:not(.phone) .lb-shelf::after{content:"";position:absolute;top:0;bottom:44px;width:70px;z-index:2;pointer-events:none}
html:not(.phone) .lb-shelf::before{left:0;background:linear-gradient(90deg,var(--bg),transparent)}
html:not(.phone) .lb-shelf::after{right:0;background:linear-gradient(270deg,var(--bg),transparent)}
html:not(.phone) .lb-sp{position:absolute;top:0;padding:0;border:0;background:var(--l2);cursor:pointer;overflow:hidden;display:flex;justify-content:center;align-items:flex-end}
html:not(.phone) .lb-sp span{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--mono);color:var(--ink);white-space:nowrap;padding:14px 0;max-height:100%;overflow:hidden;text-overflow:ellipsis}
html:not(.phone) .lb-sp.st{background:var(--l6)}
html:not(.phone) .lb-sp.done{background:var(--l7)}
html:not(.phone) .lb-sp.st span,html:not(.phone) .lb-sp.done span{color:var(--bg)}
html:not(.phone) .lb-sp:hover{outline:2px solid var(--ink);outline-offset:-2px}
html:not(.phone) .lb-cov{position:absolute;top:0;background:var(--l4);padding:28px 26px;display:flex;flex-direction:column;box-sizing:border-box}
html:not(.phone) .lb-cov b{font:400 32px/1.15 'Literata',Georgia,serif;color:var(--ink)}
html:not(.phone) .lb-au{margin-top:8px;font-size:15px;color:var(--ink-2)}
html:not(.phone) .lb-pg{margin-top:auto}
html:not(.phone) .lb-pg>i{display:block;height:4px;background:var(--l2);margin-bottom:8px}
html:not(.phone) .lb-pg>i>i{display:block;height:4px;background:var(--l7)}
html:not(.phone) .lb-pg .mono{font-size:11px;color:var(--ink-2)}
html:not(.phone) .lb-bd{position:absolute;height:2px;background:var(--ink)}
html:not(.phone) .lb-cn{position:absolute;padding:0;border:0;background:none;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);cursor:pointer;white-space:nowrap}
html:not(.phone) .lb-cn.on{color:var(--ink)}
html:not(.phone) .lb-under{display:flex;justify-content:center;align-items:center;gap:56px;margin-top:6px}
html:not(.phone) .lb-fl{border:0;background:none;font-size:24px;line-height:1;color:var(--ink-2);cursor:pointer;padding:4px 10px}
html:not(.phone) .lb-read{padding:9px 22px}
html:not(.phone) .lb-line{text-align:center;font-size:11px;color:var(--ink-3);margin-top:14px}

/* one window: Get help inside the planner chat (help.js helpView, chatwin.js) */
.pchat .pc-hctx{align-items:flex-start}
.pchat .pc-hctx b{font-weight:500}
.pchat .pc-ab{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--l7);margin-right:4px}
.pchat .pc-hsrc{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:3px}
.pchat .pc-hsrc:empty{display:none}
.pchat .pc-x{flex:none;background:none;border:0;font-size:18px;line-height:1;color:var(--ink-2);cursor:pointer;padding:0 4px}
.pchat .pc-x:hover{color:var(--ink)}
.pchat .pc-ai p{margin:0 0 8px}.pchat .pc-ai p:last-child{margin-bottom:0}
.pchat .hearly{border-left:2px solid var(--l6);padding-left:10px;font-size:14px}
.pchat .hdraft{background:var(--bg);border:1px solid var(--rule);padding:8px 10px;margin:6px 0;font-size:14px}
.pchat .hdrop{border:1px dashed var(--g4);padding:9px 11px;font-size:13.5px;color:var(--ink-2)}
.pchat .crow{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pchat .hsave-in{padding:6px 12px 4px}
.pchat .hsave-in label{display:block;color:var(--ink-2);font-size:13.5px;margin-bottom:10px}
.pchat .hsave-in input,.pchat .hsave-in textarea{display:block;width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);padding:7px 9px;margin-top:4px}
.pchat .hsave-in label.evchk{display:flex;gap:8px;align-items:center;color:var(--ink)}
.pchat .hsave-in label.evchk input,.pchat .hsave-in .spent input{width:auto;display:inline-block;margin:0}
.pchat .pc-row .hmodel{color:var(--ink-3)}.pchat .pc-row .hmodel .on{color:var(--ink);font-weight:600;text-decoration:none}
.pchat #help-drop.over{background:var(--l1)}
.pc-at{border:1px solid var(--g3);background:var(--bg);margin-bottom:6px;max-height:220px;overflow:auto}
.pc-at button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:6px 10px;border:0;border-bottom:1px solid var(--rule);background:none;font-size:13.5px;color:var(--ink);cursor:pointer}
.pc-at button:last-child{border-bottom:0}
.pc-at button span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-at button .mono{flex:none;font-size:11px;color:var(--ink-3)}
.pc-at button.on,.pc-at button:hover{background:var(--l2)}
.pc-at .pc-hsrc{padding:6px 10px}

/* the phone: the selection drawn by the page, and the bubble names what is selected (book.js bkSelPaint) */
#bk-selpaint{position:fixed;inset:0;pointer-events:none;z-index:4}
#bk-selpaint i{position:absolute;background:var(--bk-sel);opacity:.55;mix-blend-mode:multiply}
.bk-dark #bk-selpaint i{mix-blend-mode:screen;opacity:.45}
.bk .bk-bubble.bk-bq{flex-wrap:wrap}
.bk .bk-bubble .bk-said{flex-basis:100%;padding:8px 12px 0;font:13px/1.35 var(--serif);color:#E9DFF6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* figures as pictures in the reading version (Reading.addFigures on the Mac) */
.bk .bk-flow .bk-fig.bk-pic{border:0;padding:.2em 0;text-align:center}
.bk .bk-flow .bk-fig.bk-pic img{display:block;margin:0 auto;max-width:100%;height:auto;max-height:min(62vh,560px);object-fit:contain;mix-blend-mode:multiply}
.bk-dark .bk-flow .bk-fig.bk-pic img{mix-blend-mode:normal;filter:brightness(.88)}
.bk .bk-flow .bk-fig.bk-pic figcaption{text-align:left;font-size:13px}
.bk .bk-flow .bk-figpg{font-size:11px;color:var(--ink-3);margin-top:4px}

/* shapes read in code (book.js bkShape): epigraphs and their authors, small-caps titles */
.bk .bk-flow .bk-epi{font-style:italic;color:var(--ink-2);margin:.4em 0 .2em 2.2em;text-indent:0}
.bk .bk-flow .bk-attr{text-align:right;text-indent:0;font-size:.86em;color:var(--ink-2);margin:0 0 1.1em;letter-spacing:.02em}
.bk .bk-flow .bk-caps{text-transform:uppercase;letter-spacing:.05em;font-size:calc(var(--bk-size)*.92)}

/* version 2 of the text: one scale for every book (Figma "R7 Structure"); themes change only colours */
.bk .bk-flow .bk-i{font-style:italic}
.bk .bk-flow .bk-b{font-weight:600}
.bk .bk-flow .bk-h.bk-h1{font-weight:400;font-size:calc(var(--bk-size)*1.6);line-height:1.2;margin:2em 0 1em;letter-spacing:-.01em}
.bk .bk-flow .bk-h.bk-h1 .bk-hnum{display:block;font:500 11px/1.2 var(--mono);letter-spacing:.12em;color:var(--ink-3);margin-bottom:.9em}
.bk .bk-flow .bk-h.bk-h2{font-weight:600;font-size:calc(var(--bk-size)*1.1);line-height:1.3;margin:1.8em 0 .6em}
.bk .bk-flow .bk-h.bk-h3{font-weight:600;font-size:var(--bk-size);line-height:1.35;margin:1.2em 0 .4em}
.bk .bk-flow .bk-h.bk-caps.bk-h1{font-size:calc(var(--bk-size)*1.3)}
.bk .bk-flow .bk-q{margin:.9em 0 .9em 1.6em}
.bk .bk-flow .bk-epi{font-size:.84em;line-height:1.5}
.bk .bk-flow .bk-fn{font-family:var(--serif);font-weight:600;font-size:.62em;vertical-align:super;line-height:0}

/* the Library holds the page still: the shelf flips sideways, only the index scrolls (library.js libHold) */
html.lib-on,html.lib-on body{overflow:hidden;overscroll-behavior:none;height:100%}
html.lib-on .lb-ix{max-height:calc(100vh - 300px);overscroll-behavior:contain}

/* background activity in the header (activity.js): one line while something runs, the list on a click */
header.top .actbtn{display:flex;align-items:center;gap:8px;max-width:340px;height:32px;padding:0 10px;border:1px solid transparent;background:none;color:var(--ink-3);font-size:13px;cursor:pointer;margin-left:10px;flex:0 1 auto;min-width:0}
header.top .actbtn:hover,header.top .actbtn[aria-expanded="true"]{border-color:var(--g3);color:var(--ink)}
header.top .actbtn.on{color:var(--ink-2);background:var(--l1)}
.actbtn .act-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.actbtn .act-d{color:var(--ink-3)}
.actbtn .act-quiet{color:var(--g5)}
.actbtn .act-n{font-size:11px;color:var(--l7);flex:none}
.actbtn i{flex:none;width:8px;height:8px;display:block}
.actbtn .act-idle{border:1px solid var(--g4)}
.actbtn .act-run{background:var(--l6);animation:actpulse 1.2s ease-in-out infinite}
@keyframes actpulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.actbtn .act-run{animation:none}}
.actpop{position:fixed;z-index:90;width:360px;max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--g3);box-shadow:0 12px 32px rgba(0,0,0,.12);padding:6px 0 8px;font-size:13.5px}
.actpop .act-h{font-size:10.5px;letter-spacing:.08em;color:var(--ink-3);padding:10px 14px 4px}
.actpop .act-row{display:grid;grid-template-columns:16px 1fr auto;gap:8px;padding:6px 14px;align-items:start;border-bottom:1px solid var(--rule)}
.actpop .act-row:last-child{border-bottom:0}
.actpop .act-row b{font-weight:500}
.actpop .act-k{color:var(--l7);font-family:var(--mono);font-size:12px;line-height:1.5}
.actpop .act-bad .act-k{color:var(--red)}
.actpop .act-none{display:block}
.actpop .mono.faint{font-size:11px;white-space:nowrap}

/* a heading never splits from its label or from the text after it; the phone's bubble quote stays inside the bubble */
.bk .bk-flow .bk-h{break-inside:avoid;-webkit-column-break-inside:avoid;break-after:avoid;-webkit-column-break-after:avoid}
.bk .bk-flow .bk-h.bk-h1 .bk-hnum{break-after:avoid}
.bk .bk-bubble.bk-bq{width:min(336px,calc(100vw - 24px))}
.bk .bk-bubble .bk-said{min-width:0;max-width:100%;box-sizing:border-box}

/* the iPhone's activity line (activity.js phActHTML) */
html.phone .ph-act,html.phone #app .ph-act{display:flex;flex-direction:row;justify-content:flex-start;align-items:center;gap:8px;width:100%;border:0;border-bottom:1px solid var(--rule);background:none;padding:8px 2px;font-size:13px;color:var(--g5);text-align:left}
html.phone .ph-act.on{color:var(--ink-2);background:var(--l1);padding-left:10px;padding-right:10px}
html.phone .ph-act.bad{background:color-mix(in srgb,var(--red) 10%,var(--surface));color:var(--ink)}
html.phone .ph-act span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.phone .ph-act b{color:var(--l7);font-weight:500;font-size:11px}
html.phone .ph-act i{flex:none;width:8px;height:8px;display:block}
html.phone .ph-act .act-idle{border:1px solid var(--g4)}
html.phone .ph-act .act-run{background:var(--l6);animation:actpulse 1.2s ease-in-out infinite}
html.phone .ph-act.bad .act-run{background:var(--red)}
html.phone .ph-actlist{border-bottom:1px solid var(--rule);margin-bottom:8px;font-size:14px}
html.phone .ph-actlist .act-row{display:grid;grid-template-columns:16px 1fr;gap:8px;padding:8px 2px;border-bottom:1px solid var(--rule)}
html.phone .ph-actlist .act-row:last-child{border-bottom:0}
html.phone .ph-actlist .act-k{color:var(--l7);font-family:var(--mono);font-size:12px;line-height:1.5}
html.phone .ph-actlist .act-bad .act-k{color:var(--red)}
html.phone .ph-actlist .act-none{display:block;font-size:12.5px}

/* the Planner logo as the button: Mac chat launcher, iPhone add (core.js PLANNER_LOGO) */
html:not(.phone) .pc-launch.pc-logo{width:56px;height:56px;padding:0;border:0;background:none;box-shadow:none;display:block;transition:transform .15s;right:max(20px,calc(50vw - 580px));bottom:28px}
html:not(.phone) .pc-launch.pc-logo:hover{transform:rotate(30deg)}
html:not(.phone) .pc-launch.pc-logo:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.pc-launch.pc-logo .pl-logo{display:block;width:100%;height:100%}
.pc-launch.pc-logo .pc-dot{position:absolute;top:2px;right:2px;width:12px;height:12px;background:var(--ink);border:2px solid var(--bg)}
html.phone .ph-addbar.ph-logo{left:auto;right:16px;width:58px;height:58px;padding:0;border:0;background:none;box-shadow:0 6px 18px rgba(26,26,26,.18);display:block}
html.phone .ph-addbar.ph-logo .pl-logo{display:block;width:100%;height:100%}

/* the iPhone's add square in the tab bar, right of Tasks (phone.js phNavAdd) */
html.phone nav.tabs .ph-navadd{flex:none;align-self:center;width:46px;height:46px;margin:6px 8px 6px 6px;padding:0;border:0;background:none;display:block;box-shadow:none}
html.phone nav.tabs .ph-navadd .pl-logo{display:block;width:100%;height:100%}
html:not(.phone) nav.tabs .ph-navadd{display:none}
</style>
</head>
