<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="fonts/literata.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>/* light or dark (26 Nov 2026, the user's request: a dark / white toggle): the user's choice in localStorage "theme", else the Mac's setting */
(function(){ var mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
  window.themePref = function(){ try{ return localStorage.getItem('theme')||''; }catch(e){ return ''; } };
  window.themeApply = function(){ var t = themePref(); document.documentElement.classList.toggle('dark', t ? t==='dark' : !!(mq && mq.matches)); };
  themeApply(); if(mq && mq.addEventListener) mq.addEventListener('change', themeApply); })();</script>
<style>
/* v2 round 3 — design/round3. Locked P15 shades, greys, square edges. */
:root{
  /* Locked palette: P15 lilac in shades (D5), soft tints (D6), greys and near-black ink. Coral = attention only, lime = done only. */
  --bg:#FAF8F2; --surface:#FDFCF8; --rule:#DFDDD8; --ink:#1A1A1A; --ink-2:#464642; --ink-3:#50504C;
  --g1:#F1F0EB; --g2:#E5E4DF; --g3:#C9C8C3; --g4:#9C9B96; --g5:#85847F; --g6:#3F3F3C;
  --l1:#F4EFFA; --l2:#E9DFF6; --l3:#DDCDF1; --l4:#CCB6EB; --l5:#B39AD9; --l6:#9579BF; --l7:#5C477B; --l8:#523E6E;
  --red:#8E312B; --due-bg:#FBE7E5; --due-ink:#8B2E28;
  --lilac:var(--l4); --lilac-ink:#1A1A1A; --lime:#E2E984; --coral:#E0554D; --mauve:var(--g3);
  --tp:30%;
  --s-todo:#6E6D68; --s-doing:#755A9C; --s-blocked:#E0554D; --s-done:#7E8A1E;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  color-scheme:light;
}
html.dark{
  --bg:#151515; --surface:#1D1D1C; --rule:#33332F; --ink:#F2F1EC; --ink-2:#B4B3AE; --ink-3:#ABAAA6;
  --red:#F28A81; --due-bg:#3A2220; --due-ink:#F49D95;
  --g1:#202020; --g2:#2A2A28; --g3:#45453F; --g4:#6A6964; --g5:#9A9994; --g6:#D0CFCA;
  --l1:#1F1B26; --l2:#29223A; --l3:#342B49; --l4:#43375C; --l5:#5E4E80; --l6:#8470AD; --l7:#BBA4DE; --l8:#DDCDF1;
  --lilac:var(--l4); --lilac-ink:#F2F1EC; --lime:#C9D16A; --coral:#F07A70; --mauve:var(--g3);
  --tp:40%;
  --s-todo:#9A9994; --s-doing:#B39AD9; --s-blocked:#F07A70; --s-done:#C9D16A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--sans);-webkit-text-size-adjust:100%;font-feature-settings:"tnum" 1}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
a{color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:20px 20px 72px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.cc{--tint:color-mix(in srgb,var(--c) var(--tp),var(--bg))}

/* top bar */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--rule);margin-bottom:28px}
.brand{font-weight:600;font-size:16px}
nav.tabs{display:flex;gap:2px;overflow-x:auto}
nav.tabs a{padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--ink-2);font-weight:500;font-size:16px;white-space:nowrap}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{background:var(--lilac);color:var(--lilac-ink)}

h2{font-size:15px;font-weight:600;margin:0 0 12px;color:var(--ink)}
h2 .muted{font-weight:400}
section{margin-bottom:36px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:40px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:1fr;gap:8px}}

/* A07 — big date */
.dayhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:12px;background:var(--lilac);color:var(--lilac-ink);border-radius:22px;padding:18px 24px 16px}
.dnum{font-size:clamp(72px,11vw,104px);line-height:.82;font-weight:400;letter-spacing:-.04em}
.dmeta{text-align:right;font-size:20px;line-height:1.3}
.dmeta div:last-child{opacity:.72}
/* Date and calendar today, side by side */
.dayrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-bottom:10px;align-items:stretch}
.dayrow .dayhead{margin-bottom:0}
.dayrow .calnow{background:var(--surface);padding:12px 18px 6px;margin:0}
.dayrow .calnow h2{margin-bottom:0}.dayrow .calnow .ev{padding:5px 0;line-height:1.3}.dayrow .calnow .ttitle{font-size:16px}.dayrow .calnow .tmeta{font-size:13px}.dayrow .calnow .time{font-size:14px}.dayrow .calnow .join{padding:0 6px;font-size:12px}
.dayrow .calnow h2{margin-top:0}
.dayrow .calnow .ev:first-of-type{border-top:0}
@media (max-width:900px){.dayrow{grid-template-columns:1fr}}

/* F48 — big numbers */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:36px}
.tile{background:var(--surface);border-radius:14px;padding:12px 16px 14px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between}
.tile.cc{background:var(--tint)}
.tile .lbl{font-size:15px;color:var(--ink-2)}
.tile.cc .lbl{color:var(--ink)}
.tile .num{font-size:clamp(40px,5.5vw,56px);line-height:1;font-weight:400;letter-spacing:-.03em}
.tile .num small{font-size:.38em;letter-spacing:0;margin-left:4px}
.tile .foot{font-size:15px;line-height:1.35}
.tile .tag{white-space:normal;align-items:flex-start}.tile .tag svg{margin-top:3px}
.tiles{grid-template-columns:minmax(0,1.5fr) minmax(0,.8fr)}.tiles.wc{grid-template-columns:minmax(0,1.5fr) minmax(0,.8fr) minmax(0,1.7fr)}
.tile.lt .foot{display:grid;gap:4px;font-size:14px}
.tile.brief{background:var(--l2)}.cprog{background:var(--surface);padding:14px 16px;border:1px solid var(--rule)}
.pbar2{height:3px;background:var(--l2);overflow:hidden;margin-bottom:12px}.pbar2 i{display:block;height:100%;width:30%;background:var(--lilac);animation:pslide 1.2s ease-in-out infinite}
@keyframes pslide{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
.psteps{list-style:none;margin:0;padding:0;font-size:15px;line-height:1.7;color:var(--ink-3)}.psteps .ok{color:var(--ink-2)}.psteps .pcur{color:var(--ink);font-weight:500}
.pfound{margin-top:10px;padding-top:8px;border-top:1px solid var(--rule);font-size:14px}.pfound div{padding:2px 0}.pfound div::before{content:"+ ";color:var(--ink-3)}
.dlmove{position:relative;display:inline-block;cursor:pointer;text-decoration:underline;text-underline-offset:2px;color:var(--ink-2)}.dlmove input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.dlh{font-size:14px;font-weight:400}
.brief .hub{display:flex;justify-content:space-between;align-items:center}.brief .hunav{display:flex;gap:8px;align-items:center;font-size:13px}.brief .hunav button{font-size:18px;line-height:1;padding:0 4px}.brief .hunav button[disabled]{opacity:.3;cursor:default}.brief .nt{font-size:15px;line-height:1.3;color:var(--ink)}.brief .foot .muted{font-size:13px}.tile.brief .lbl{color:var(--ink)}
.brief .ndl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;padding-bottom:6px;min-height:0;padding-left:0}.brief .ndl .num{font-size:36px;line-height:1}.brief .ndl .nt{font-size:15px;line-height:1.3}.brief .ndl .muted{font-size:13px}.brief .sw{display:inline-block}
.brief .bline{display:grid;grid-template-columns:6.6em minmax(0,1fr);gap:8px;align-items:baseline;padding:4px 0;border-top:1px solid color-mix(in srgb,var(--ink) 14%,transparent);font-size:13px;color:var(--ink-2);line-height:1.3}.brief .bline .mono{font-size:12px}
.ctile{justify-content:flex-start}
.ctile .ctop{gap:12px;margin-bottom:6px}.ctile .ctop svg.clock{width:48px;height:48px}
.ctile .leave,.ctile .leave .mono{font-size:20px}
.ctile .tz{padding-top:6px}.ctile .tz h3{margin-bottom:4px}
.ctile .tz li{font-size:14px;padding:2px 0;line-height:1.35}
@media (max-width:900px){.tiles.wc{grid-template-columns:1fr 1fr}.tiles.wc .ctile{grid-column:1/-1}}
.tile{min-width:0}

/* status chips (E33) */
.st{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--rule);font-size:14px;font-weight:500;white-space:nowrap;position:relative;cursor:pointer}
.st svg{width:15px;height:15px;flex:none}
.st select{appearance:none;-webkit-appearance:none;background:transparent;border:0;padding:0;margin:0;font-size:14px;font-weight:500;cursor:pointer}
.st select:focus-visible{outline:none}
.st:focus-within{outline:2px solid var(--ink);outline-offset:2px}
.st-todo svg{color:var(--s-todo)} .st-doing svg{color:var(--s-doing)} .st-blocked svg{color:var(--s-blocked)} .st-done svg{color:var(--s-done)}
.st-doing{background:color-mix(in srgb,var(--lilac) 45%,var(--surface))}
.st-blocked{background:color-mix(in srgb,var(--coral) 16%,var(--surface))}
.st-done{background:color-mix(in srgb,var(--lime) 55%,var(--surface))}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-2);white-space:nowrap}
.tag svg{width:15px;height:15px;flex:none}
.tag.warn{color:var(--ink)} .tag.warn svg{color:var(--coral)}
.sw{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none;display:inline-block}

/* A07 — plain list */
ul.list{list-style:none;margin:0;padding:0}
.task{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:2px 14px;padding:14px 0;border-top:1px solid var(--rule);align-items:start}
.task:first-child{border-top:0}
.check{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink-3);background:transparent;cursor:pointer;padding:0;margin-top:1px;display:grid;place-items:center}
.check:hover{border-color:var(--ink)}
.task.done .check{background:var(--lime);border-color:var(--lime)}
.task.done .check::after{content:"";width:6px;height:11px;border:solid #2B2533;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.task.done .ttitle{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px}
.ttitle{font-weight:500}
.tmeta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin-top:4px;font-size:14px;color:var(--ink-2)}
.tnote{font-size:15px;color:var(--ink-2);margin-top:6px;max-width:68ch}
.tside{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.est{font-size:15px;color:var(--ink-2)}
.spent{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-2)}
.spent input{font:inherit;font-size:14px;width:62px;padding:3px 6px;border:1px solid var(--rule);background:var(--surface);color:var(--ink)}
.spent.ask{margin-top:6px;flex-wrap:wrap}
.spent.ask input{border-color:var(--ink-2);width:72px}   /* not the 100% of .ask input (19 Nov 2026 user test) */
.spent .faint{font-size:13px}
.lnk{background:none;border:0;padding:0;color:var(--ink-2);font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule)}
.lnk:hover{color:var(--ink);text-decoration-color:var(--ink)}
.task .dcol{display:none}
.list.dated .task{grid-template-columns:96px 30px minmax(0,1fr) auto}
.list.dated .task .dcol{display:block;font-size:14px;color:var(--ink-2);padding-top:2px}
@media (max-width:620px){
  .task{grid-template-columns:30px minmax(0,1fr)}
  .tside{grid-column:2;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:flex-start;gap:8px 14px}
  .list.dated .task{grid-template-columns:30px minmax(0,1fr)}
  .list.dated .task .dcol{grid-column:2;grid-row:1;padding:0}
  .list.dated .task .check{grid-row:2}
}
.ev{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:2px 14px;padding:12px 0;border-top:1px solid var(--rule)}
.ev:first-child{border-top:0}
.ev .bar{width:4px;height:100%;min-height:22px;border-radius:2px;background:var(--c);margin-left:10px}
.ev .time{font-size:15px;color:var(--ink-2)}
.empty{color:var(--ink-2);padding:8px 0}

/* F45 + F43 — commute */
.commute{background:var(--surface);border-radius:14px;padding:18px}
.ctop{display:flex;align-items:center;gap:18px;margin-bottom:16px}
.ctop svg.clock{width:88px;height:88px;flex:none}
.leave{font-size:30px;line-height:1.1;font-weight:400}
.leave .mono{font-size:30px}
.csub{color:var(--ink-2);font-size:15px;margin-top:4px}
.tzfold{border-top:1px solid var(--rule)}
.tz{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;border-top:1px solid var(--rule);padding-top:12px}
@media (max-width:560px){.tz{grid-template-columns:1fr;gap:14px}}
.tz.tz1{grid-template-columns:1fr}.tz.tz1 li{grid-template-columns:60px minmax(0,1fr)}
.tz h3{font:500 15px/1.3 var(--sans);margin:0 0 8px;color:var(--ink);display:flex;justify-content:space-between}.tz h3 span:last-child{font-family:var(--mono);color:var(--ink-2);font-weight:400}
.tz ol{list-style:none;margin:0;padding:0}
.tz li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:5px 0;font-size:16px}
.tz li .mono{color:var(--ink-2);font-size:15px}
.tz h3 span.over{color:var(--coral)}

/* aside */
.drow{display:grid;grid-template-columns:62px minmax(0,1fr);gap:2px 12px;padding:10px 0;border-top:1px solid var(--rule)}
.drow:first-child{border-top:0}
.drow .d{font-size:15px}
.drow .t{font-weight:500;line-height:1.35}
.drow .s{font-size:14px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.flag{padding:10px 0;border-top:1px solid var(--rule);font-size:15px}
.flag:first-child{border-top:0}
.note{font-size:15px;color:var(--ink-2);border-left:2px solid var(--rule);padding-left:12px}

/* B11 — week timetable */
.wbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.wbar h1{font-size:28px;font-weight:400;margin:0 8px 0 0;letter-spacing:-.01em}
.btn{background:var(--surface);border:1px solid var(--rule);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:15px;font-weight:500}
.btn:hover{border-color:var(--ink-3)}
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
.wk{display:grid;grid-template-columns:52px repeat(7,minmax(138px,1fr));min-width:1020px}
.wk .hd{padding:8px 8px 10px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--bg)}
.wk .hd .dn{font-size:22px;line-height:1.1}
.wk .hd .dn small{font-size:15px;color:var(--ink-2);margin-right:6px}
.wk .hd.today .dn{font-weight:600}
.wk .hd.today{box-shadow:inset 0 -4px 0 var(--lilac)}
.wk .hd .hs{font-size:14px;color:var(--ink-2);margin-top:2px;display:flex;flex-wrap:wrap;gap:2px 10px}
.wk .dl{font-size:13.5px;line-height:1.3;margin-top:6px;padding:4px 6px;border-radius:6px;background:var(--tint);display:flex;gap:6px}
.wk .dl.sess{background:transparent;border:1px dashed var(--c);color:var(--ink-2)}
.hours{position:relative}
.hours span{position:absolute;right:8px;font-size:13px;color:var(--ink-3);transform:translateY(-50%)}
.col{position:relative;border-left:1px solid var(--rule);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--ph) - 1px),color-mix(in srgb,var(--rule) 60%,transparent) calc(var(--ph) - 1px),color-mix(in srgb,var(--rule) 60%,transparent) var(--ph))}
.col.past{background-color:color-mix(in srgb,var(--rule) 18%,transparent)}
.blk{position:absolute;left:3px;right:3px;border-radius:6px;padding:5px 7px;overflow:hidden;font-size:13.5px;line-height:1.3;background:var(--tint);border-left:3px solid var(--c)}
.blk b{font-weight:600;display:block}
.blk .mono{font-size:12.5px;color:var(--ink-2)}
.blk.travel{background:repeating-linear-gradient(135deg,var(--surface) 0 6px,color-mix(in srgb,var(--rule) 55%,var(--surface)) 6px 12px);border-left:3px solid var(--ink-3);color:var(--ink-2)}
.blk.travel ul{margin:3px 0 0;padding:0;list-style:none}
.blk.travel li{color:var(--ink);font-size:13px}
.now{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--ink);z-index:2}
.trow{border-top:1px solid var(--rule);border-left:1px solid var(--rule);padding:8px 4px;display:flex;flex-direction:column;gap:4px;min-height:60px}
.tlabel{font-size:13px;color:var(--ink-3);padding:10px 8px 0 0;text-align:right;border-top:1px solid var(--rule)}
.tb{border-radius:6px;padding:5px 7px 5px 8px;font-size:13.5px;line-height:1.3;border:1px dashed var(--c);background:color-mix(in srgb,var(--c) 10%,var(--bg));display:flex;gap:6px;align-items:flex-start}
.tb svg{width:13px;height:13px;flex:none;margin-top:2px}
.tb.done{opacity:.55;text-decoration:line-through}
.tb .mono{color:var(--ink-2);font-size:12.5px;margin-left:auto;padding-left:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--ink-2);margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg-box{width:18px;height:12px;border-radius:3px;display:inline-block}

/* D32 + C18 — term */
.load{background:var(--surface);border-radius:14px;padding:18px 18px 10px;margin-bottom:36px}
.load svg{width:100%;height:auto;display:block}
.load .cap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.months{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px}
@media (max-width:900px){.months{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.months{grid-template-columns:1fr}}
.mname{font-size:28px;font-weight:400;letter-spacing:-.01em;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline}
.mname small{font-size:14px;color:var(--ink-2)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px;font-family:var(--mono)}
.cal .wd{font-size:12.5px;color:var(--ink-3);text-align:center;padding-bottom:4px}
.cal button{background:none;border:0;padding:4px 0 6px;font-size:16px;color:var(--ink-2);cursor:pointer;border-radius:8px;position:relative;font-family:var(--mono)}
.cal button:hover{background:var(--surface)}
.cal button.past{color:var(--ink-3)}
.cal button.dead{color:var(--ink);font-weight:600}
.cal button.today{background:var(--lilac);color:var(--lilac-ink);font-weight:600}
.cal .ul{position:absolute;left:22%;right:22%;bottom:2px;display:flex;gap:2px;height:3px}
.cal .ul i{flex:1;background:var(--c);border-radius:2px}
.cal .ul i.sess{background:transparent;border-top:1.5px dotted var(--c);height:0}
.cal .hv{position:absolute;top:2px;right:16%;width:5px;height:5px;border-radius:50%;background:var(--coral)}
.mlist{margin-top:14px;border-top:1px solid var(--rule)}
.mlist div{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;padding:7px 0;border-bottom:1px solid var(--rule);font-size:15px;line-height:1.35}
.mlist .mono{color:var(--ink-2)}
.mlist .sw{margin-right:6px}

/* E39 — courses */
.course{padding:22px 0 26px;border-top:1px solid var(--rule)}
.course:first-of-type{border-top:0;padding-top:0}
.chead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.chead h3{font-size:20px;font-weight:500;margin:0;display:flex;align-items:center;gap:10px}
.chead h3 .sw{width:12px;height:12px}
.phases{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);gap:8px;overflow-x:auto;padding-bottom:4px}
.phase{background:var(--tint);border-radius:12px;padding:12px 14px;text-align:left;border:0;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:140px}
.phase:hover{filter:brightness(.98)}
.phase[aria-expanded="true"]{box-shadow:inset 0 0 0 2px var(--c)}
.phase .pt{font-weight:500;line-height:1.3}
.phase .pd{font-size:15px}
.phase .pf{margin-top:auto;font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.pbar{height:4px;border-radius:2px;background:color-mix(in srgb,var(--c) 30%,var(--bg));overflow:hidden}
.pbar i{display:block;height:100%;background:var(--c)}
.axis{position:relative;height:30px;margin-top:10px}
.axis .ln{position:absolute;left:0;right:0;top:10px;border-top:1px solid var(--rule)}
.axis .sp{position:absolute;top:6px;height:8px;border-radius:4px;background:var(--c);opacity:.75}
.axis .tk{position:absolute;top:2px;width:2px;height:16px;background:var(--ink);border-radius:1px}
.axis .now{top:0;bottom:0;height:auto;border-top:0;border-left:1.5px dashed var(--ink-2);width:0}
.axis .m{position:absolute;top:16px;font-size:12.5px;color:var(--ink-3);font-family:var(--mono)}
.cnote{font-size:15px;color:var(--ink-2);max-width:80ch;margin:0 0 12px}
.ptasks{margin-top:12px;background:var(--surface);border-radius:12px;padding:4px 16px}

/* all tasks */
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px;align-items:center}
.filters select{background:var(--surface);border:1px solid var(--rule);border-radius:999px;padding:7px 14px;font-size:15px}
.loading{padding:60px 0;color:var(--ink-2);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---- round 3 ---- */
.sw{display:none}
.task .sw,.ctile .sw{display:inline-block;vertical-align:baseline}
.list .task:not(.done){box-shadow:inset 4px 0 0 var(--c);padding-left:16px}
.tile.lil{background:var(--l2)}
.ev .bar{background:var(--l5)}
.cal .ul i{background:var(--l6)} .cal .ul i.sess{background:transparent;border-top:1.5px dotted var(--g4)}
.cal .hv{background:var(--coral)}
.axis .sp{background:var(--l5);opacity:1} .axis .tk{background:var(--ink)}
.pbar{background:var(--g2)} .pbar i{background:var(--l6)}
.task.done .check,.cell.t-done .check,.pt-done .check{background:var(--lime);border-color:var(--lime)}
.cell.t-done .check::after,.pt-done .check::after{content:"";width:5px;height:9px;border:solid #1A1A1A;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.check.sm{width:18px;height:18px;margin-top:2px}

/* A1 + A6 — week as rows: flat day field, typed schedule, tasks */
.wk2{border-top:1px solid var(--ink)}
.wk2-head,.wday{display:grid;grid-template-columns:200px minmax(0,1.25fr) minmax(0,1fr);gap:0 32px}
.wk2-head{font-size:13.5px;color:var(--ink-2);padding:8px 0;border-bottom:1px solid var(--rule)}
.wk2-head span:first-child{padding-left:16px}
.wday{border-bottom:1px solid var(--rule);margin:0;min-height:150px}
.wday.past{opacity:.55}
.wfield{background:var(--g1);padding:16px 16px 14px;display:flex;flex-direction:column}
.wday.today .wfield{background:var(--l4);color:var(--lilac-ink)}
.wfield .pn{font-size:52px;line-height:.9;letter-spacing:-.03em}
.wfield .pwk{font-size:16px;margin-top:8px}
.wfield .pmeta{font-size:14px;color:var(--ink-2);margin-top:4px}
.wday.today .wfield .pmeta{color:inherit}
.wfield .wdue{margin-top:auto;padding-top:12px;font-size:14px;line-height:1.35;display:flex;flex-direction:column;gap:6px}
.wfield .wdue div{border-left:3px solid var(--l6);padding-left:8px}
.wday.today .wfield .wdue div{border-left-color:var(--ink)}
.wfield .wdue div.sess{border-left:3px dotted var(--g4)}
.wsched,.wtasks{padding:12px 0 14px}
.wsched ol,.wtasks ul{list-style:none;margin:0;padding:0}
.wsched li{display:grid;grid-template-columns:104px minmax(0,1fr);gap:0 12px;padding:5px 0;line-height:1.4}
.wsched .pt{font-family:var(--mono);font-size:14.5px;color:var(--ink-2);white-space:nowrap}
.wsched .pw{font-size:16px;font-weight:500}
.wsched .ps{display:block;font-weight:400;font-size:14px;color:var(--ink-2)}
.wsched li.tr .pw{font-weight:400;color:var(--ink-2)}
.wsched .ps ul{list-style:none;margin:2px 0 0;padding:0}
.wsched .ps ul li{display:block;padding:1px 0;color:var(--ink)}
.wtasks li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:5px 0;line-height:1.4;font-size:16px}
.wtasks .ps{display:block;font-size:14px;color:var(--ink-2)}
.wtasks .ps .mono{white-space:nowrap}
.pt-done > span:nth-of-type(1){text-decoration:line-through;color:var(--ink-3)}
.pcarry{display:flex;gap:8px;align-items:flex-start;font-size:15px;text-decoration:none;padding:5px 0 8px}
.pcarry svg{margin-top:4px;width:14px;height:14px;color:var(--coral);flex:none}
.pempty{color:var(--ink-3);font-size:15px;padding:5px 0}
@media (max-width:860px){
  .wk2-head{display:none}
  .wday{grid-template-columns:1fr;gap:0}
  .wfield{flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
  .wfield .pn{font-size:40px}
  .wfield .wdue{flex-basis:100%;margin-top:6px}
  .wsched,.wtasks{padding:10px 0}
  .wtasks{border-top:1px solid var(--rule)}
}

/* B6 — season list under each month */
.season{list-style:none;margin:18px 0 0;padding:0}
.season li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:0 10px;padding:4px 0;font-size:15px;line-height:1.3}
.season .sd{color:var(--ink-2)}
.season .sc{display:block;font-size:13.5px;color:var(--ink-2)}

/* C7 — numbered cells */
.cells{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));border-top:1px solid var(--ink);border-left:1px solid var(--rule)}
.cells > li{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);background:var(--surface);min-height:190px;display:flex;flex-direction:column}
.cell{padding:12px 14px 14px;gap:8px}
.chd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cn{font-size:30px;line-height:1;letter-spacing:-.02em}
.cd{font-size:14px;color:var(--ink-2)}
.ct{font-weight:500;line-height:1.35}
.cm{font-size:13.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.cf{margin-top:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cf .est{font-size:14px}
.cell .lnk{align-self:flex-start;font-size:13.5px}
.cell.t-done{background:color-mix(in srgb,var(--lime) 28%,var(--surface))}
.cell.t-done .ct{text-decoration:line-through;color:var(--ink-2)}
.cell.t-doing{background:var(--l1)}
.cell.t-blocked .cn{color:var(--coral)}
.cells > li.wsep{grid-column:1/-1;min-height:0;background:var(--bg);flex-direction:row;justify-content:space-between;align-items:baseline;padding:22px 0 8px;border-right:0;border-bottom:1px solid var(--ink);font-size:17px;font-weight:500}
.cells > li.wsep:first-child{padding-top:4px}
.cells:has(> li.wsep){border-top:0;border-left:0}
.cells:has(> li.wsep) > li:not(.wsep){border-left:1px solid var(--rule);margin-left:-1px}
.dcell{background:none;border:0;padding:12px 14px 14px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:8px;flex:1}
.dcell:hover{background:var(--g1)}
.cells > li.open{background:var(--l2)}
.cells > li.open .dcell:hover{background:transparent}
.course .ptasks{background:transparent;padding:0;margin-top:18px}
.course .ptasks h2{margin:0 0 6px}

/* Mac app: input field, proposals, brain */
.compose textarea,.ask input,.ptable input,.ptable select,.mmeta select,#m-notes,.recopts select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);padding:9px 11px;width:100%}
.compose textarea:focus,.ask input:focus,#m-notes:focus{outline:2px solid var(--l6);outline-offset:-1px}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.crow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.cprov{font-size:14px}
.mpick select{font:inherit;font-size:14px;background:transparent;border:0;border-bottom:1px solid var(--rule);padding:2px 0;color:var(--ink-2)}
.cthread{border-left:3px solid var(--l4);padding-left:12px;margin-bottom:10px;font-size:15px;display:flex;flex-direction:column;gap:6px}
.cthread .ca{color:var(--ink-2)}
.cthread .cu,.cthread .ca{overflow-wrap:anywhere;min-width:0}   /* a very long word never widens the page (19 Nov 2026 user test) */
.cfocus{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:8px 12px;margin-bottom:10px;background:var(--l2);font-size:15px}
.cquick{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:8px}
.cerr{margin-top:10px} .cerr .tag,.cdone,.psum,.msg,.pch,.prow span{overflow-wrap:anywhere}   /* a long word or line never widens the page */ .cdone{margin-top:10px;padding:8px 12px;background:color-mix(in srgb,var(--lime) 40%,var(--surface))}
.prop{border-top:1px solid var(--ink);padding-top:10px}
.psum{margin:0 0 8px}
.plabel{font-size:13.5px;color:var(--ink-2);margin:12px 0 4px}
.evbtn{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px}
.evbtn:hover{text-decoration-color:var(--g4)}
#evedit:empty{display:none}
.evedit{position:fixed;top:72px;right:24px;width:380px;max-width:calc(100vw - 32px);max-height:calc(100vh - 96px);overflow:auto;background:var(--surface);border:1px solid var(--g3);box-shadow:0 12px 32px rgba(0,0,0,.12);padding:18px 20px;z-index:60;font-size:15px}
.evedit h2{margin-bottom:14px}
.evedit label{display:block;color:var(--ink-2);font-size:13.5px;margin-bottom:10px}
.evedit input,.evedit select,.evedit textarea{display:block;width:100%;margin-top:4px;font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--rule);padding:7px 9px}
.evedit input:focus,.evedit select:focus,.evedit textarea:focus{outline:2px solid var(--l6);outline-offset:-1px}
.evedit .evrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.evedit label.evchk{display:flex;gap:8px;align-items:center;color:var(--ink)}
.evedit label.evchk input{width:auto;margin:0}
.evedit .crow{margin-top:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.evedit .evdel{margin-left:auto}
.evedit .evro{color:var(--ink-2)}
.help{position:fixed;top:72px;right:24px;bottom:24px;width:480px;max-width:calc(100vw - 32px);display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--g3);box-shadow:0 12px 32px rgba(0,0,0,.12);padding:18px 20px;z-index:65;font-size:15px}
.help.min{top:auto;bottom:24px;width:auto;max-width:calc(100vw - 48px);flex-direction:row;align-items:center;gap:14px;padding:10px 14px}
.help .hhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.help h2{margin:2px 0 0;font-size:18px}
.help .hsrc{font-size:13.5px}
.help .hdrop{border:1px dashed var(--g4);padding:9px 11px;font-size:13.5px;color:var(--ink-2)}
.help .hdrop.over{background:var(--l2);border-color:var(--l6);color:var(--ink)}
.help .hnote{font-size:13.5px}
.help .hmodel{font-size:13.5px;color:var(--ink-3)}
.help .hmodel .on{color:var(--ink);font-weight:600;text-decoration:none}
.wbar .hmodel{font-size:13.5px;color:var(--ink-3);margin:0 6px}.wbar .hmodel .on{color:var(--ink);font-weight:600;text-decoration:none}
.hmodel .htok{font-size:11px;margin-left:8px;color:var(--ink-3)}
.help .hearly{border-left:2px solid var(--l6);padding-left:10px}
.help .hearly .plabel{margin-bottom:2px}
.help .hdraft{background:var(--bg);border:1px solid var(--rule);padding:8px 10px;margin:6px 0;font-size:14px}
.help .hthread{flex:1;min-height:60px;overflow:auto;display:flex;flex-direction:column;gap:12px;padding-right:4px}
.help .hsave{flex:0 1 auto;min-height:0;overflow:auto;padding-right:4px}
.help .hsave .plabel{margin:4px 0 6px}
.help .crow.hsavebar{margin-top:0;flex:none}
.help .hcmp textarea,.help .hsave input,.help .hsave textarea{display:block;width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--rule);padding:8px 10px;margin-top:4px}
.help .hcmp textarea:focus,.help .hsave input:focus,.help .hsave textarea:focus{outline:2px solid var(--l6);outline-offset:-1px}
.help .hsave label{display:block;color:var(--ink-2);font-size:13.5px;margin-bottom:10px}
.help .hsave label.evchk{display:flex;gap:8px;align-items:center;color:var(--ink)}
.help .hsave label.evchk input,.help .hsave .spent input{width:auto;display:inline-block;margin:0}
.help .crow{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dlist{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:8px;font-size:15px}
.pevf{display:grid;grid-template-columns:minmax(0,1fr) 140px 128px 128px minmax(0,1fr);gap:8px;flex:1}
.pevf input{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);padding:6px 8px;min-width:0}
.prow{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--rule);font-size:15px}
.prow>span:first-child{flex:1;min-width:0} .prow>.lnk{flex:none} .ptick{flex:none;display:flex;gap:6px;align-items:center;white-space:nowrap;font-size:14px;color:var(--ink)}   /* risky rows: removal, deadline move, calendar change (actions.js) */
.cchips{flex-wrap:wrap;gap:8px}
.pch{font-size:14px;color:var(--ink-2)}
.ptable{list-style:none;margin:0;padding:0}
.ptable li{display:grid;grid-template-columns:minmax(0,1fr) 140px 150px 80px 140px auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule)}
.ptable input,.ptable select{padding:6px 8px;font-size:15px}
.pwarn{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px}
.recbar{background:var(--g1);padding:18px;margin-bottom:32px}
.recbar.on{background:var(--l2)}
.recmain{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.recbtn{width:132px;height:132px;border:0;background:var(--ink);color:var(--bg);font:600 18px var(--sans);cursor:pointer}
.recbtn.on{background:var(--coral);color:#1A1A1A}
.recopts{display:flex;flex-direction:column;gap:8px}
.ck{display:flex;align-items:center;gap:8px;font-size:15px}
.recopts select{width:auto}
.rectime{font-size:48px;line-height:1;letter-spacing:-.02em}
.recstage{padding:6px 0}
.ask .crow input{flex:1;min-width:240px;width:auto}
.answer{margin-top:14px;border-left:3px solid var(--l6);padding-left:14px}
.mtitle{font:400 30px/1.2 var(--sans);color:var(--ink);border:0;border-bottom:1px solid var(--rule);background:transparent;width:100%;padding:6px 0;margin:4px 0 8px}
.mmeta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:10px}
.mmeta select{width:auto;padding:4px 8px}
audio{width:100%;margin:6px 0 18px}
.mcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;margin-top:16px}
.md h3{font-size:16px;margin:14px 0 6px} .md p{margin:0 0 8px}
.mlist2{padding-left:20px;margin:0 0 12px} .mlist2 li{margin:3px 0}
.wsched li.ce .pw{font-weight:400}
.wsched .pw,.wsched .ps,.ev .ttitle,.ev .tmeta{overflow-wrap:anywhere}
.join{font:500 13.5px/1.2 var(--sans);color:var(--lilac-ink);background:var(--l2);border:1px solid var(--l5);padding:3px 8px;margin-left:6px;cursor:pointer;white-space:nowrap;vertical-align:1px}
.join.on{background:var(--l4);border-color:var(--l6);color:var(--ink)}   /* Get help with a question from the iPhone waiting */
.join:hover{background:var(--l3)}
.priv{margin-top:10px;font-size:14px;color:var(--ink-2)}
.priv summary{cursor:pointer}
.priv label{display:block;margin:8px 0 4px}
.priv input{font:inherit;font-size:15px;width:100%;padding:7px 9px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);margin-top:4px}
.chat{border-top:1px solid var(--ink);padding-top:10px}
.chathead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.topics{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.topic{font:500 14px var(--sans);background:var(--g1);border:1px solid var(--rule);padding:5px 10px;cursor:pointer;color:var(--ink)}
.topic .mono{color:var(--ink-2);font-size:13px;margin-left:4px}
.topic.on{background:var(--l4);border-color:var(--l6);color:var(--lilac-ink)}
.tdesc{margin:0 0 10px;font-size:15px}
.thread{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow:auto;padding:4px 0 8px}
/* PDF reader: the native PDF view sits over .rpdf; the reading partner is the column on the right */
.reader{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;background:var(--bg)}
.reader .rbar{display:flex;align-items:center;gap:18px;padding:10px 20px;border-bottom:1px solid var(--rule);background:var(--surface)}
.reader .rtitle{flex:1;min-width:0}.reader .rtitle b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
.reader .rpg{color:var(--ink-2);font-size:13.5px}
.reader .rtools{display:flex;gap:8px;align-items:center}.reader .rtools .lnk{margin-left:6px}
.reader .rbody{flex:1;display:flex;min-height:0}
.reader .rpdf{flex:1;min-width:0;background:var(--g1)}
.reader .rside{width:440px;flex:none;display:flex;flex-direction:column;gap:10px;padding:16px 20px;border-left:1px solid var(--rule);background:var(--surface);font-size:15px;min-height:0}
.reader .hsrc,.reader .hnote{font-size:13.5px}
.reader .hthread{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px;padding-right:4px}
.reader .rempty{font-size:14px;line-height:1.5}
.reader .rsel{font-size:13.5px;line-height:1.4;border-left:2px solid var(--l5);padding-left:10px}.reader .rsel:empty{display:none}
.reader .rquick{display:flex;gap:6px;flex-wrap:wrap}.reader .btn.sm{font-size:13.5px;padding:4px 11px}
.reader .rpl{font-family:var(--mono);font-size:.92em}
.reader .rmarks ul{list-style:none;margin:6px 0 0;padding:0;max-height:180px;overflow:auto;font-size:13.5px}
.reader .rmarks li{padding:4px 0 4px 10px;border-left:2px solid var(--l7);margin-bottom:4px}.reader .rmarks li.highlight{border-left-color:var(--l4);background:var(--l1)}.reader .rmarks li.note{border-left-color:var(--l6);font-style:italic}
.reader .rtools .btn.on{background:var(--l4);border-color:var(--l5);color:var(--ink)}
.reader .rnote .muted{font-size:13.5px;margin:4px 0 8px}.reader .rnote textarea{width:100%}
.reader .hmodel{font-size:13.5px;color:var(--ink-3)}.reader .hmodel .on{color:var(--ink);font-weight:600;text-decoration:none}
.reader .hcmp textarea,.reader .hsave textarea,.reader .hsave select{display:block;width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--rule);padding:8px 10px;margin-top:4px}
.reader .hsave textarea{font-size:14px;line-height:1.45}
.reader .hcmp textarea:focus,.reader .hsave textarea:focus{outline:2px solid var(--l6);outline-offset:-1px}
.reader .hsave label{display:block;color:var(--ink-2);font-size:13.5px;margin:8px 0}
.reader .hsave label.evchk{display:flex;gap:8px;align-items:center;color:var(--ink)}.reader .hsave label.evchk input{width:auto;margin:0}
.reader .crow{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* Book-style reader on the Mac (book.js; reader redesign, Figma B1–B8). Square edges, P15 shades only. */
.reader.bk{display:block;--serif:'Literata','Iowan Old Style','Charter',Georgia,serif;--bk-size:20px;--bk-hl:var(--l2);--bk-sel:var(--l4)}
.reader.bk-light{--bg:#FAF8F2;--surface:#FDFCF8;--rule:#DFDDD8;--ink:#1A1A1A;--ink-2:#55544F;--ink-3:#6B6A65;--g1:#F1F0EB;--g2:#E5E4DF;--g3:#C9C8C3;--g4:#9C9B96;--g5:#6E6D68;--g6:#3F3F3C;--l1:#F4EFFA;--l2:#E9DFF6;--l3:#DDCDF1;--l4:#CCB6EB;--l5:#B39AD9;--l6:#9579BF;--l7:#755A9C;--l8:#523E6E;color-scheme:light}
.reader.bk-dark{--bg:#151515;--surface:#1D1D1C;--rule:#33332F;--ink:#F2F1EC;--ink-2:#B4B3AE;--ink-3:#8F8E89;--g1:#202020;--g2:#2A2A28;--g3:#45453F;--g4:#6A6964;--g5:#9A9994;--g6:#D0CFCA;--l1:#1F1B26;--l2:#29223A;--l3:#342B49;--l4:#43375C;--l5:#5E4E80;--l6:#8470AD;--l7:#B39AD9;--l8:#DDCDF1;color-scheme:dark}
html.dark .reader.bk:not(.bk-light){--bk-hl:#342B49;--bk-sel:var(--l5)}
.reader.bk-dark{--bk-hl:#342B49;--bk-sel:var(--l5)}
.reader.bk{background:var(--bg);color:var(--ink)}
.bk .bk-top{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:12px;padding:0 24px;z-index:3;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .25s}
.bk.ui .bk-top{opacity:1;pointer-events:auto}
.bk.bk-panel .bk-top{right:540px}
.bk .bk-title{flex:1;text-align:center;font-size:14px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk .bk-tools{display:flex;gap:6px}
.bk .bk-ib{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border:0;background:none;color:var(--ink-2);cursor:pointer;padding:0}
.bk .bk-ib:hover{color:var(--ink);background:var(--g1)}.bk .bk-ib.on{background:var(--l2);color:var(--ink)}
.bk .bk-aa{font-family:var(--serif);font-size:18px}
.bk .bk-view{position:absolute;overflow:hidden}
.bk.bk-page .bk-view{display:none}
.bk .bk-flow{height:100%;column-fill:auto;font-family:var(--bk-font,var(--serif));font-weight:var(--bk-weight,400);letter-spacing:var(--bk-ls,0);word-spacing:var(--bk-ws,0);font-size:var(--bk-size);line-height:var(--bk-lh,1.6);color:var(--ink);font-variant-numeric:oldstyle-nums;font-feature-settings:normal;-webkit-font-smoothing:antialiased;hanging-punctuation:first}
.bk .bk-flow ::selection{background:var(--bk-sel)}
.bk .bk-flow p{margin:0;text-indent:1.3em;orphans:2;widows:2}
.bk.bk-just .bk-flow p,.bk.bk-just .bk-flow .bk-q{text-align:justify;-webkit-hyphens:auto;hyphens:auto}
.bk .bk-flow .bk-chap,.bk .bk-flow .bk-h{font-weight:400}.bk .bk-flow .bk-h{font-weight:600}
/* themes (Aa › Themes & Settings); night = the dark shades when the Mac is dark */
.reader.bk.bkt-original{--bg:#FDFCF8}
.reader.bk.bkt-paper{--bg:#F1F0EB;--surface:#FAF8F2}
.reader.bk.bkt-calm{--bg:#F4EFFA;--ink:#3F3F3C;--surface:#FDFCF8;--bk-hl:var(--l3)}
.reader.bk.bkt-focus{--bg:#FAF8F2}
.reader.bk.bkt-quiet{--bg:#3F3F3C;--ink:#C9C8C3;--ink-2:#9C9B96;--ink-3:#9C9B96;--surface:#45453F;--rule:#6A6964;--g1:#45453F;--bk-hl:#5E4E80}
.bk .bk-flow p.cont,.bk .bk-flow .bk-chap+p,.bk .bk-flow .bk-h+p{text-indent:0}
.bk .bk-flow .bk-chap+p:not(.cont),.bk .bk-flow .bk-h+p:not(.cont){text-indent:1.3em}
.bk .bk-flow p+p{margin-top:.15em}
.bk .bk-flow .bk-chap{text-align:center;font-size:calc(var(--bk-size)*1.65);line-height:1.2;margin:.4em 0 1.1em;break-after:avoid}
.bk .bk-flow .bk-h{font-family:var(--serif);font-weight:600;font-size:calc(var(--bk-size)*1.05);line-height:1.35;margin:1.2em 0 .5em;break-after:avoid}
.bk .bk-flow .bk-q{margin:.6em 0 .6em 1.6em;font-size:.94em;line-height:1.55}
.bk .bk-flow .bk-li{text-indent:0;padding-left:1.2em}
.bk .bk-flow .bk-fig{margin:.8em 0;padding:.6em 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);font-family:var(--sans);font-size:14px;break-inside:avoid}
.bk .bk-flow .bk-fig figcaption{color:var(--ink-2);margin-top:4px}
.bk .bk-flow .hl{background:var(--bk-hl)}
.hcp .hcr{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:10px 0;cursor:pointer;color:var(--ink);font:14px/1.35 var(--sans)}.hcp .hcr:hover b{text-decoration:underline}.hcp .hcr span{font-size:12px}
.bk .bk-flow .nt{box-shadow:inset 0 -2px 0 #755A9C;cursor:help}   /* a note: the highlight with a line under it, its text on hover */
.bk .bk-flow .ul{text-decoration:underline;text-decoration-color:var(--l7);text-underline-offset:3px}
.bk .bk-flow .tp{background:var(--l1)}.bk .bk-flow .tp.cur{background:var(--l4)}
.bk .bk-flow .fh{background:var(--l2)}.bk .bk-flow .fh.cur{background:var(--l5)}
.bk .bk-flow .bk-fn{font-family:var(--sans);font-size:.62em;color:var(--l7);cursor:pointer;padding:0 1px}
.bk .bk-pdf{display:none;position:absolute;top:56px;left:0;right:0;bottom:56px;background:var(--g1)}
.bk.bk-page .bk-pdf{display:block}.bk.bk-page.bk-panel .bk-pdf{right:540px}
.bk .bk-foot{position:absolute;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;gap:16px;padding:0 120px;font-size:12px;color:var(--ink-3);z-index:2}
.bk.bk-panel .bk-foot{right:540px;padding:0 48px}
.bk.bk-page .bk-foot{padding:0 32px}
.bk .bk-fl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk .bk-fc{flex:none;max-width:55%}
.bk .bk-fr{flex:1;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk .bk-fr .lnk,.bk .bk-fr button{font-size:12px;color:var(--ink-2)}
.bk .bk-foot i{font-style:normal;font-family:var(--mono);color:var(--ink-3);margin-left:4px}
.bk .bk-note{color:var(--ink-2)}.bk .bk-note.warn{color:var(--coral)}
/* bubble at the selection */
.bk .bk-bubble{position:fixed;z-index:6;display:flex;background:#1A1A1A;box-shadow:0 6px 18px rgba(26,26,26,.18)}
.bk .bk-bubble::after{content:'';position:absolute;left:calc(var(--tail) - 7px);bottom:-7px;width:14px;height:7px;background:#1A1A1A;clip-path:polygon(0 0,100% 0,50% 100%)}
.bk .bk-bubble.below::after{bottom:auto;top:-7px;clip-path:polygon(50% 0,100% 100%,0 100%)}
.bk .bk-bubble button{width:104px;height:64px;border:0;background:none;color:#FDFCF8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font:500 13px var(--sans)}
.bk .bk-bubble button+button{border-left:1px solid #3F3F3C}
.bk .bk-bubble button:first-child{color:#DDCDF1}
.bk .bk-bubble button:hover{background:#2A2A28}
.bk .bk-bubble i{font:400 9.5px var(--mono);color:#9C9B96;font-style:normal}
/* Define card, footnote */
.bk .bk-define{position:fixed;z-index:6;width:380px;background:var(--surface);border:1px solid var(--rule);border-top:3px solid var(--l6);box-shadow:0 6px 18px rgba(26,26,26,.12);padding:14px 16px 16px;font-size:14.5px;line-height:1.45}
.bk .bk-fnote{width:420px;max-height:300px;overflow:auto}
.bk .bk-dh{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px}.bk .bk-dh .faint{font-size:12.5px}
.bk .bk-dl{font-size:11px;color:var(--l7);margin:10px 0 2px}.bk .bk-dict{white-space:pre-line;max-height:260px;overflow:auto}.bk .bk-dp{color:var(--ink-2);font-size:13.5px}
/* ☰ menu, Aa */
.bk .bk-menu{position:fixed;top:56px;right:62px;z-index:6;width:300px;max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--rule);box-shadow:0 6px 18px rgba(26,26,26,.12);padding:8px 0}
.bk .bk-aapop{right:20px;padding:8px 16px 14px}
.bk .bk-ml{font-size:11px;color:var(--l7);padding:8px 16px 6px}.bk .bk-aapop .bk-ml{padding:8px 0 6px}
.bk .bk-mi{display:flex;justify-content:space-between;gap:10px;width:100%;border:0;background:none;padding:7px 16px;font-size:14px;color:var(--ink);text-align:left;cursor:pointer}
.bk .bk-mi:hover{background:var(--g1)}.bk .bk-mi.on{background:var(--l2)}.bk .bk-mi .faint{font-size:13px;flex:none}
.bk .bk-toc{max-height:46vh;overflow:auto}
.bk .bk-rule{height:1px;background:var(--rule);margin:8px 0}
.bk .bk-mstate{padding:0 16px 6px;font-size:13.5px;color:var(--ink-2)}
.bk .bk-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.bk .bk-row .btn.on{background:var(--l2)}
/* Themes & Settings popover (the user's reference: Apple Books), square */
.bk .bk-aapop{width:340px;padding:0 16px 16px;max-height:calc(100vh - 80px)}
.bk .bk-aah{display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:600;color:var(--ink-2);padding:12px 0 10px;border-bottom:1px solid var(--rule);margin:0 -16px 14px}
.bk .bk-custom .bk-aah{justify-content:space-between;padding:6px 8px}
.bk .bk-aarow{display:flex;gap:10px;margin-bottom:14px}
.bk .bk-seg{flex:1;display:flex;background:var(--g1)}
.bk .bk-seg button{flex:1;height:48px;border:0;background:none;color:var(--ink);cursor:pointer;font-family:var(--sans)}.bk .bk-seg button+button{border-left:1px solid var(--rule)}
.bk .bk-seg button:hover,.bk .bk-sun:hover{background:var(--g2)}
.bk .bk-sun{width:72px;height:48px;border:0;background:var(--g1);color:var(--ink-3);cursor:pointer;display:flex;align-items:center;justify-content:center}.bk .bk-sun.on{background:var(--l2);color:var(--ink)}
.bk .bk-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.bk .bk-tile{height:92px;border:1px solid var(--rule);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:0}
.bk .bk-tile .aa{font-size:30px;line-height:1.1}.bk .bk-tile span:last-child{font-size:14px}
.bk .bk-tile.on{outline:2px solid var(--ink);outline-offset:-2px}
.bk .bk-cust{width:100%;height:46px;border:0;background:var(--g1);color:var(--ink);font:600 15px var(--sans);display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}.bk .bk-cust:hover{background:var(--g2)}
.bk .bk-reset{font-weight:400;color:var(--ink-2);margin-top:12px}
.bk .bk-sec{font-size:11px;color:var(--ink-3);margin:6px 0 6px}
.bk .bk-box{background:var(--bg);border:1px solid var(--rule);margin-bottom:12px}
.bk .bk-cr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;font-size:14.5px}.bk .bk-box>*+*{border-top:1px solid var(--rule)}
.bk .bk-cr select{font-size:14px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);padding:4px 6px}
.bk .bk-sw{width:44px;height:24px;border:0;background:var(--g3);padding:3px;cursor:pointer;display:flex}.bk .bk-sw i{width:18px;height:18px;background:var(--surface);display:block;transition:transform .15s}
.bk .bk-sw.on{background:var(--l6)}.bk .bk-sw.on i{transform:translateX(20px)}
.bk .bk-sl{padding:8px 12px 10px}.bk .bk-sll{font-size:11px;color:var(--ink-3);margin-bottom:4px}
.bk .bk-slr{display:flex;align-items:center;gap:10px}.bk .bk-slr input{flex:1;accent-color:var(--l6)}.bk .bk-slr input:disabled{opacity:.4}.bk .bk-slr .mono{font-size:12.5px;min-width:44px;text-align:right;color:var(--ink-2)}
/* find */
.bk .bk-find{position:fixed;top:62px;left:50%;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--rule);box-shadow:0 6px 18px rgba(26,26,26,.12);padding:6px 6px 6px 12px}
.bk.bk-panel .bk-find{left:calc((100% - 540px)/2)}
.bk .bk-find input{border:0;background:none;font-size:15px;width:240px;outline:none;color:var(--ink)}
.bk .bk-find .mono{font-size:12px;min-width:52px;text-align:right}
/* the side panel: Explain, Reading notes, a note */
.bk .bk-side{position:absolute;top:0;right:0;bottom:0;width:540px;display:none;flex-direction:column;background:var(--l1);border-left:1px solid var(--rule);z-index:4}
.bk.bk-panel .bk-side{display:flex}
.bk .bk-ph{display:flex;align-items:center;gap:10px;padding:10px 16px;flex:none}
.bk .bk-pk{flex:1;text-align:center;font-size:11.5px;letter-spacing:.06em;color:var(--l7)}
.bk .bk-pa{display:flex;gap:2px;min-width:34px;justify-content:flex-end}
.bk .bk-pt{flex:1;overflow:auto;padding:4px 24px 12px;display:flex;flex-direction:column;gap:12px}
.bk .bk-topic{display:flex;flex-direction:column;gap:12px}.bk .bk-topic+.bk-topic{border-top:1px solid var(--l3);padding-top:16px;margin-top:6px}
.bk .bk-src{font-size:11px;color:var(--ink-3)}
.bk .bk-qt{font-family:var(--serif);font-size:25px;line-height:1.3;border-left:3px solid var(--l6);padding:2px 0 2px 14px;color:var(--ink)}
.bk .bk-qt.sm{font-size:17px;line-height:1.4}
.bk .bk-a{font-size:16px;line-height:1.55;color:var(--ink)}.bk .bk-a p{margin:0 0 .7em}.bk .bk-a p:last-child{margin-bottom:0}
.bk .bk-u{align-self:flex-end;max-width:78%;background:var(--l3);padding:10px 14px;font-size:15px;line-height:1.45}
.bk .bk-old summary{font-size:11px;color:var(--ink-3);cursor:pointer;padding:4px 0}.bk .bk-old .bk-a,.bk .bk-old .bk-u{margin-top:10px}
.bk .bk-chips{display:flex;gap:8px;padding:8px 16px 0;flex:none}
.bk .bk-chip{border:1px solid var(--l4);background:none;padding:5px 12px;font-size:14px;color:var(--ink-2);cursor:pointer}.bk .bk-chip:hover{background:var(--l2)}
.bk .bk-in{display:flex;gap:8px;padding:10px 16px 0;flex:none}
.bk .bk-in input{flex:1;height:46px;border:1px solid var(--l5);background:var(--surface);padding:0 12px;font-size:15.5px;color:var(--ink);outline:none}
.bk .bk-in input:focus{border-color:var(--l7)}
.bk .bk-send{width:46px;height:46px;border:0;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer}.bk .bk-send:disabled{opacity:.4}
.bk .bk-hint{text-align:center;font-size:12.5px;color:var(--ink-3);padding:10px 0 14px;flex:none}
.bk .bk-wrap{padding:0 24px 20px;flex:none}.bk .bk-wrap textarea{background:var(--surface)}
.bk .bk-side .tag.warn{margin:0 24px}
.bk .bk-wait{padding:48px 24px;font-family:var(--sans);font-size:15px;line-height:1.5;color:var(--ink-2)}
/* download: a lilac sweep on a pale track (square, palette shades); still with reduced motion */
.bk .bk-wait p{text-indent:0;margin:0 0 8px;font:inherit;hyphens:none}
.bk-dl{position:relative;width:180px;height:3px;background:var(--l2);overflow:hidden;margin:0 0 18px}
.bk-dl i{position:absolute;top:0;bottom:0;left:-40%;width:40%;background:var(--l6);animation:bkdl 1.1s cubic-bezier(.45,0,.55,1) infinite}
@keyframes bkdl{to{left:100%}}
.ph-dl{display:inline-block;position:relative;width:18px;height:2px;background:var(--l2);overflow:hidden;vertical-align:middle;margin-left:6px}.ph-dl i{position:absolute;top:0;bottom:0;left:-50%;width:50%;background:var(--l6);animation:bkdl 1.1s cubic-bezier(.45,0,.55,1) infinite}
@media (prefers-reduced-motion:reduce){.bk-dl i,.ph-dl i{animation:none;left:30%}}
/* the phone (Figma frames 21–30): the text scrolls; a tap shows the bars */
.bk.bk-phone .bk-flow{-webkit-touch-callout:none;transition:transform .22s ease-out}
.bk.bk-phone .bk-flow.still{transition:none}
.bk.bk-phone .bk-flow .bk-chap{margin:.6em 0 1em}
@media (prefers-reduced-motion:reduce){.bk.bk-phone .bk-flow{transition:none}}
.bk.bk-phone .bk-top{height:52px;padding:0 6px;gap:6px;background:var(--bg);border-bottom:1px solid var(--rule)}
.bk.bk-phone .bk-title{text-align:left;font-size:14px;min-width:0}
.bk.bk-phone .bk-tools{gap:0}
.bk.bk-phone .bk-ib{width:38px;height:40px}
.bk .bk-tp{display:flex;border:1px solid var(--rule);flex:none}
.bk .bk-tp button{border:0;background:none;font:13px var(--sans);color:var(--ink-2);padding:5px 10px}.bk .bk-tp button.on{background:var(--l3);color:var(--ink)}
.bk.bk-phone .bk-foot{display:block;height:auto;padding:0 16px calc(6px + env(safe-area-inset-bottom));background:none;pointer-events:none}
.bk.bk-phone.ui .bk-foot{background:var(--bg);border-top:1px solid var(--rule);pointer-events:auto}
.bk.bk-phone .bk-prog{height:2px;background:var(--g2);margin:0 -16px 8px}.bk.bk-phone .bk-prog i{display:block;height:100%;background:var(--l6)}
.bk.bk-phone .bk-frow{display:flex;align-items:center;gap:10px;font-size:11.5px;min-height:22px}
.bk.bk-phone:not(.ui) .bk-prog,.bk.bk-phone:not(.ui) .bk-frow{display:none}
.bk.bk-phone .bk-fpg{text-align:center;font-size:11px;color:var(--ink-3);padding:6px 0 0}.bk.bk-phone.ui .bk-fpg{display:none}
.bk.bk-phone .bk-sm{font-size:11.5px;white-space:normal}
.bk.bk-phone .bk-pdf{top:52px}
.bk.bk-phone .bk-pdef{position:static;width:auto;margin:8px 0 4px;box-shadow:none}.bk .bk-pdef .bk-dh{align-items:center}
.bk.bk-phone .bk-bubble button{width:84px}.bk.bk-phone .bk-bubble i{display:none}
.bk.bk-phone .bk-define{max-width:calc(100vw - 24px)}
.bk.bk-phone .bk-menu{right:8px;top:56px;width:min(340px,calc(100vw - 16px))}
.bk.bk-phone .bk-find{top:auto;bottom:0;left:0;right:0;transform:none;padding:8px 8px calc(8px + env(safe-area-inset-bottom)) 16px;box-shadow:none;border-width:1px 0 0}
.bk.bk-phone .bk-find input{flex:1;width:auto;font-size:16px}
/* Explain: the whole screen, lilac; a swipe left closes it */
.bk.bk-phone .bk-side{position:fixed;inset:0;width:auto;border-left:0;z-index:8;will-change:transform}
.bk.bk-phone .bk-pt{padding:4px 20px 12px}
.bk.bk-phone .bk-qt{font-size:23px}.bk.bk-phone .bk-qt.sm{font-size:17px}
.bk.bk-phone .bk-in{padding:10px 12px 0}.bk.bk-phone .bk-in input{font-size:16px}
.bk.bk-phone .bk-chips{padding:8px 12px 0;flex-wrap:wrap}
.bk.bk-phone .bk-hint{padding:8px 0 calc(10px + env(safe-area-inset-bottom))}
.bk.bk-phone .rkey input{display:block;width:100%;font-size:16px;margin-top:8px;padding:8px 10px;border:1px solid var(--rule);background:var(--surface);color:var(--ink)}
.bk.bk-phone.bk-fetch .bk-pdf{display:none}
/* Filing dropped documents: a floating panel, a drop cue while dragging */
.filing{position:fixed;top:72px;right:24px;width:460px;max-width:calc(100vw - 32px);max-height:calc(100vh - 96px);overflow:auto;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--g3);box-shadow:0 12px 32px rgba(0,0,0,.12);padding:18px 20px;z-index:80;font-size:15px}
.filing>*{flex-shrink:0}
.filing .hhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.filing h2{margin:2px 0 0;font-size:18px}
.filing .flrow{border-top:1px solid var(--rule);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.filing label{display:block;color:var(--ink-2);font-size:13.5px}
.filing input,.filing select{display:block;width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--rule);padding:7px 10px;margin-top:4px}
.filing input:focus,.filing select:focus{outline:2px solid var(--l6);outline-offset:-1px}
.filing .flname{display:flex;align-items:center;gap:6px}.filing .flname input{flex:1}
.filing .flpick{display:flex;gap:10px}.filing .flpick label{flex:1;min-width:0}
.filing .flto{font-size:13px;word-break:break-all}

.cvmn5 button.today{background:var(--l4);color:var(--lilac-ink)}
.cvml{list-style:none;margin:0;padding:10px 12px 18px;border-top:1px solid var(--rule)}

.cvdue{font-weight:600;font-size:13px}
.cvdue span,.cvs span{font-weight:400;color:var(--ink-3)}

.cvlg-hv{position:relative;padding-right:9px}
.cvlg-hv::after{content:"";position:absolute;top:2px;right:0;width:6px;height:6px;border-radius:50%!important;background:var(--coral)}
/* Month, one month (round 7): numbers left, list right; the bar already names the month */
.cvm1{border-top:1px solid var(--ink)}
.cvm1 .cvm{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);border-left:0}
.cvm1 .cvmt{display:none}
.cvm1 .cvmn5{padding:18px 32px 24px 0;gap:6px 8px;align-content:start}

/* Week (W6): sidebar plus day columns as text, two rows of four, thin rules */
.cvw6{display:grid;grid-template-columns:220px repeat(4,minmax(0,1fr));border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.cvws{grid-row:1 / span 2;padding:12px 18px 18px 0;border-right:1px solid var(--rule)}

.cvdonebtn{display:block;margin-top:18px;font-size:13px}
.cvwhint{font-size:12.5px;color:var(--ink-3);margin:22px 0 0;line-height:1.4}
.cvwc{display:flex;flex-direction:column;margin:0;padding:12px;border-right:1px solid var(--rule);min-width:0;min-height:300px}

.cvwc.past{color:var(--ink-3)}
.cvwc.past .cvt{opacity:.7}
.cvwc.today{background:var(--l1)}
.cvwc.over{outline:2px solid var(--l6);outline-offset:-2px}
.cvwc.nodrop{opacity:.4}
.cvnext{background:var(--g1)}
.cvlab{font-size:11.5px;color:var(--ink-3);margin-top:10px}
.cvlab:first-child{margin-top:0}
.cvval{font-size:13.5px;line-height:1.35;color:inherit}
.cvval .tag{font-size:12px;margin-left:4px}
.cvwdl{margin-top:10px}
.cvwdl .cvdue,.cvwdl .cvs{margin-top:3px}
.cvad{display:block;width:100%;text-align:left;margin-top:4px;border:0;border-bottom:2px solid var(--ink);background:none;font-size:12.5px;padding:0;cursor:pointer;color:inherit;overflow-wrap:anywhere}
.cvr{display:grid;grid-template-columns:82px minmax(0,1fr);gap:6px;width:100%;text-align:left;background:none;border:0;padding:3px 0;font:inherit;font-size:13px;line-height:1.3;color:inherit}
.cvr .mono{font-size:11.5px;color:var(--ink-3);padding-top:1px}
.cvr small{display:block;font-size:11.5px;color:var(--ink-3);overflow-wrap:anywhere}
.cvr.cl > span:last-child{color:var(--ink-2)}
.cvr.ev{cursor:pointer;box-shadow:inset 3px 0 0 var(--l5);padding-left:6px;grid-template-columns:78px minmax(0,1fr)}
.cvr.ev:hover{background:var(--l2)}
.cvr.busy{background:repeating-linear-gradient(45deg,var(--g2) 0 2px,transparent 2px 7px)}
.cvr .lnk{font-size:11.5px}
.cvt{display:flex;gap:7px;align-items:flex-start;border-top:1px solid var(--rule);padding:5px 0 6px;font-size:13px;line-height:1.3;cursor:grab}
.cvt > span{min-width:0;overflow-wrap:anywhere}
.cvt .check{flex:none}
.cvt small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:2px}
.cvt.dragging{opacity:.4}
.cvt.pt-done > span{text-decoration:line-through;color:var(--ink-3)}
.cvwc .pcarry{font-size:13px;padding:3px 0 5px}
.cvwc .pempty{font-size:13px}
.cvdone{font-size:12.5px;color:var(--ink-3);margin-top:4px}
.cvdone summary{cursor:pointer;list-style:none}
.cvdone summary::-webkit-details-marker{display:none}
.cvdone[open] summary{margin-bottom:5px}
.cvwf{margin-top:auto;padding-top:16px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.cvwn{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:.9}
.cvwc.today .cvwn{background:var(--l4);color:var(--lilac-ink);padding:2px 4px 0}
.cvwf .lnk{font-size:12.5px}
@media (max-width:1000px){.cvw6{grid-template-columns:repeat(2,minmax(0,1fr))}.cvws{grid-row:auto;grid-column:1 / -1;border-right:0}.cvwc{border-top:1px solid var(--ink)}}

/* M2 Week */
/* each band row is as tall as the fullest day that week (subgrid), so days line up and empty bands take no room; Tasks get the rest */
/* Week fits the window and never scrolls (27 Nov 2026, the user's request: "Calendar should not scroll, make it resize"): Due and
   Classes & events take what they need, at most 18 % and 26 % of the window height (vh: WebKit collapsed fit-content rows
   in a subgrid to nothing), Tasks the rest; a band with more scrolls inside itself. Narrow or short windows switch to
   compact type (media rules after the M2 block). */
.mx-wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:auto auto auto minmax(0,1fr);border-top:1px solid var(--ink);height:max(360px,calc(100vh - 210px));overflow-wrap:break-word}
/* Week and Month fit the window: no page scroll (26 Nov 2026, the user's report: "some pages are scrollable when they are not needed") */
html:not(.phone) .wrap:has(.mx-wk),html:not(.phone) .wrap:has(.mx-mo){padding-bottom:0}
.mx-wd{border-left:1px solid var(--rule);padding:0 10px;display:grid;grid-row:1 / 5;grid-template-rows:subgrid;min-height:0;min-width:0}
.mx-wd:first-child{border-left:0;padding-left:0}
.mx-wd.today{background:var(--l1)}
.mx-wd.over{outline:2px solid var(--l6);outline-offset:-2px}.mx-wd.nodrop{opacity:.45}
.mx-wd .band{border-bottom:1px solid var(--rule);padding:10px 0;overflow:auto}
.mx-wd .dh{display:flex;justify-content:space-between;align-items:baseline}
.mx-wd .dh b{font:600 26px/1 var(--sans)}.mx-wd .dh span{font-size:11px;color:var(--ink-3);text-transform:uppercase}
.mx-wd.today .dh b{background:var(--ink);color:var(--bg);padding:2px 5px}
.mx-wd.past .dh b{color:var(--ink-3);font-weight:400}
.mx-wd .ld,.mx-cell .ld{height:6px;background:var(--g1);margin-top:12px;display:flex;overflow:hidden}
.ld i{display:block;height:100%;flex:none}.ld .w{background:var(--l6)}.ld .c{background:var(--g5);margin-left:1px}
.mx-wd .lh{font-size:11px;color:var(--ink-3);margin-top:5px;display:flex;justify-content:space-between;gap:4px}
.lh .hv{color:var(--red);font-weight:600}
.mx-wd .band:first-child{overflow:visible}
.mx-wd .pcarry{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--red);text-decoration:none;margin-bottom:4px}.mx-wd .pcarry svg{width:12px;height:12px}
.mx-wd .b-due{max-height:18vh}.mx-wd .b-ev{max-height:26vh}.mx-wd .b-tk{border-bottom:0;min-height:0}
.bl{font-size:11px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;display:flex;justify-content:space-between;gap:4px}
.bl .lnk{font:500 14px/1 var(--sans);text-decoration:none;padding:0 2px}
.mx-wd .empty{font-size:12px;color:var(--ink-3);padding:0}
/* a deadline in Week takes at most two lines (full title on hover), so empty days do not keep a tall empty Due band
   (27 Nov 2026, the user's screenshot: "this space its wasted for this days") */
.mx-wd .mx-dp,.mx-wd .mx-ss{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mx-dp{font:500 12px/1.3 var(--sans);background:var(--due-bg);color:var(--due-ink);padding:4px 6px;margin-bottom:4px}

/* compact Week: narrow windows put the hours and the time under the title, short ones tighten the bands */
@media (max-width:1150px){html:not(.phone) .mx-tt{grid-template-columns:auto minmax(0,1fr)}html:not(.phone) .mx-tt .h{grid-column:2}html:not(.phone) .mx-tt .t{-webkit-line-clamp:3}
  html:not(.phone) .mx-pe{flex-direction:column;gap:0}html:not(.phone) .mx-pe .tm{width:auto}html:not(.phone) .mx-wd{padding:0 6px}html:not(.phone) .mx-wd .dh b{font-size:21px}}
@media (max-width:900px){html:not(.phone) .mx-pe .r{display:none}html:not(.phone) .mx-wd .bl{letter-spacing:0;font-size:10px}html:not(.phone) .mx-wd .lh{flex-direction:column}html:not(.phone) .mx-wd .dh span{display:none}}

  html:not(.phone) .mx-cell{padding:4px 6px 8px}html:not(.phone) .mx-cell .x.ec{display:none}}
.mx-tt .h{font-size:11px;color:var(--ink-3)}

.mx-tt.dragging{opacity:.4}
.mx-ttx{grid-column:1/-1;background:var(--surface);border:1px solid var(--g3);padding:8px;margin-top:4px;font-size:12px;cursor:auto}
.mx-ttx .ttitle{font-size:13px;font-weight:500}.mx-ttx .mx-acts{font-size:12px;gap:6px 10px}
.mx-wsum{display:flex;gap:26px;font-size:12px;color:var(--ink-3);padding:10px 0 0;align-items:baseline;flex-wrap:wrap}
.mx-wsum b{color:var(--ink);font-weight:500}.mx-wsum .lnk{font-size:12px}

/* M3 Month */
.mx-mo{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:36px;align-items:start}
.mx-mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--ink)}
.mx-mg .mx-wn{height:30px}
.mx-wn{font-size:11px;color:var(--ink-3);padding:8px 8px 6px}
.mx-cell{height:max(46px,calc((100vh - 252px) / var(--rows,6)));border:0;border-top:1px solid var(--rule);border-left:1px solid var(--rule);padding:6px 8px 14px;display:flex;flex-direction:column;gap:3px;position:relative;background:none;text-align:left;color:var(--ink);overflow:hidden;cursor:pointer;min-width:0}

.mx-cell.cmd{background:var(--l1);box-shadow:inset 3px 0 0 var(--l6)}

.x{font-size:11px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;flex:none}

.x.ec{color:var(--ink-3)}
.mx-cell .ld{position:absolute;left:8px;right:8px;bottom:6px;height:4px;margin:0}
.mx-cell .ld.hv{outline:1px solid var(--coral)}
.mx-mkey{display:flex;gap:18px;font-size:11px;color:var(--ink-3);padding:10px 0 0;flex-wrap:wrap}
.mx-mkey i{display:inline-block;width:10px;height:6px;margin-right:6px;vertical-align:middle}
.mx-mkey .k-du{background:var(--due-bg);outline:1px solid var(--coral)}.mx-mkey .k-cm{background:var(--l1);box-shadow:inset 3px 0 0 var(--l6)}
.mx-mside{padding-top:6px;position:sticky;top:86px;max-height:calc(100vh - 250px);overflow-y:auto}

.mx-mev .bx{width:3px;background:var(--l5);flex:none}.mx-mev .bx.due{background:var(--coral)}.mx-mev .bx.tk,.mx-mev .bx.g{background:var(--g3)}

@media (max-width:1000px){.mx-mo{grid-template-columns:minmax(0,1fr) 230px;gap:20px}}   /* the picked day stays beside the month, so nothing scrolls */
@media (max-width:720px){.mx-mo{grid-template-columns:1fr}.mx-mside{display:none}}

/* M4 Year (term) */
.mx-yr{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:30px;align-items:start}
.mx-chh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;gap:12px}
.mx-chh b{font:600 16px var(--sans)}.mx-chh span{font-size:12px;color:var(--ink-3)}
.mx-chart{width:100%;height:auto;display:block}.mx-chart .ldhit{cursor:pointer}.mx-chart .ldhit:hover{fill:color-mix(in srgb,var(--ink) 6%,transparent)}
.mx-lg{display:flex;align-items:center;gap:8px;font-size:12px;padding:3px 0}.mx-lg i{width:10px;height:10px;flex:none}.mx-lg span{flex:1}.mx-lg b{font-weight:400;font-size:11px;color:var(--ink-3)}
.mx-mths{display:grid;border-top:1px solid var(--ink);margin-top:44px}
.mx-mc{padding:16px 14px 0;border-left:1px solid var(--rule);min-width:0}.mx-mc:first-child{border-left:0;padding-left:0}
.mx-mch{font:600 18px var(--sans);margin:4px 0 12px;display:flex;justify-content:space-between;align-items:baseline;width:100%;background:none;border:0;padding:0;color:var(--ink);cursor:pointer;text-align:left}

.mx-mc.cur .mx-mch{color:var(--l8)}

.mx-di .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mx-di .c{color:var(--ink-3)}
.mx-di.past .t{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--g4)}
.mx-mr{font-size:12px;color:var(--ink-3);padding:4px 0}

/* M5 All tasks */
.mx-at{display:grid;grid-template-columns:230px minmax(0,1fr);gap:44px;padding-top:6px;align-items:start}
.mx-cl{border-top:1px solid var(--ink)}

.mx-cr>span:last-child{font-size:11px;color:var(--ink-3);white-space:nowrap}

.mx-cr .pb{display:block;height:2px;background:var(--g2);margin-top:5px}.mx-cr .pb i{display:block;height:100%;background:var(--l6)}
.mx-tl{border-top:1px solid var(--ink)}

.mx-wh b{font:600 16px var(--sans)}.mx-wh span{font-size:12px;color:var(--ink-3)}
.mx-wh.fold{padding:11px 0}.mx-wh.fold b{font-weight:500;color:var(--ink-2)}
.mx-dh{display:flex;gap:10px;align-items:baseline;padding:12px 0 4px;font-size:14px}.mx-dh span{font-size:11px;color:var(--ink-3)}.mx-dh b{flex:1;font-weight:500}
.mx-tr,.mx-colh{display:grid;grid-template-columns:22px minmax(0,1fr) 150px 64px 70px 84px 44px;gap:12px;align-items:center}
.mx-tr{padding:5px 0;border-bottom:1px solid var(--g2);font-size:13.5px;line-height:1.35;outline:none}

.mx-tr .d,.mx-tr .h,.mx-tr .dl{font-size:12px;color:var(--ink-3)}.mx-tr .h{text-align:right}

.mx-tr:hover .c,.mx-tr:focus-within .c{display:none}
.mx-tr:hover .acts,.mx-tr:focus-within .acts{display:flex}
.mx-dates{flex-basis:100%;color:var(--ink-3);font-size:13px}.mx-dates .mx-pick{color:var(--ink)}
.cdates{font-size:13px;color:var(--ink-3);margin:4px 0}.cdates .mx-dates{font-size:13px}
.mx-pick{position:relative;cursor:pointer;text-decoration:underline dotted var(--g4);text-underline-offset:3px}

.mx-tr .acts>*,.mx-tr .acts .lnk,.mx-tr .acts .join{font:500 12px var(--sans);border:1px solid var(--g5);background:var(--surface);color:var(--ink);padding:3px 7px;white-space:nowrap;text-decoration:none;margin:0}

/* M6 Brain · a session */
.mx-brain{padding-bottom:80px}
.mx-bh{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding:22px 0 14px;border-bottom:1px solid var(--ink)}
.mx-bt{flex:1;min-width:0}.mx-bt .lbl.lnk{text-decoration:none;font:500 11px var(--mono)}
.mx-mtitle{font:600 34px/1.1 var(--sans);letter-spacing:-.6px;border:0;background:none;width:100%;padding:0;margin-top:10px;color:var(--ink);outline:none}
.mx-mtitle:focus{border-bottom:1px solid var(--l6)}
.mx-bh .m{font-size:12px;color:var(--ink-3);margin-top:8px}
.mx-bh .r{display:flex;gap:8px;align-items:center;position:relative;flex:none}
.mx-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:20;background:var(--surface);border:1px solid var(--g3);box-shadow:0 10px 28px rgba(0,0,0,.12);width:280px;display:flex;flex-direction:column;padding:6px 0}
.mx-menu>button{background:none;border:0;text-align:left;padding:8px 14px;font-size:14px;color:var(--ink);cursor:pointer}
.mx-menu>button:hover{background:var(--l1)}.mx-menu>button.warn{color:var(--red)}
.mx-menu label,.mx-mrow{padding:8px 14px;font-size:13px;color:var(--ink-2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.mx-mrow .lnk.on{color:var(--ink);font-weight:600}
.mx-bs{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:44px;padding-top:18px;align-items:start}
.mx-sm p{font:15px/1.55 var(--sans);margin:6px 0 16px}
.mx-sm h3{font:600 14px var(--sans);margin:18px 0 6px;display:flex;justify-content:space-between;align-items:baseline}
.mx-sm h3 span,.mx-sm h3 .lnk{font:400 12px var(--mono);color:var(--ink-3)}
.mx-sm ul{margin:0;padding:0}
.mx-sm li{list-style:none;font-size:14px;line-height:1.4;padding:5px 0;border-top:1px solid var(--g2);display:flex;gap:10px;align-items:flex-start}

.mx-sm li>span:nth-child(2){flex:1}
.mx-sm li .ok{font-size:11px;color:var(--ink-3);white-space:nowrap}
.mx-sm textarea{width:100%;border:1px solid var(--g3);background:var(--surface);padding:8px;font-size:14px;color:var(--ink)}
.mx-cv{display:flex;flex-direction:column;border-left:1px solid var(--rule);padding-left:28px;position:sticky;top:86px;max-height:calc(100vh - 200px);margin:0}

.mx-cv .thread{overflow:auto;flex:1;min-height:80px;display:flex;flex-direction:column}
.mx-q{align-self:flex-end;background:var(--l2);padding:8px 12px;font-size:14px;margin:6px 0 10px;max-width:90%}
.mx-a{border-left:3px solid var(--l6);padding:2px 0 2px 14px;font-size:14px;line-height:1.5;margin-bottom:10px}
.mx-a p{margin:0 0 8px}.mx-a .lnk{font-size:12px}
/* Brain answers by source (brAnswerHTML): classes plain, general knowledge and the web set off and labelled */
.br-part{margin:0 0 12px}.br-part:last-child{margin-bottom:0}
.br-lab{display:block;font-size:11px;letter-spacing:.02em;color:var(--g5);margin:0 0 3px}
.br-general,.br-web{padding-left:10px;border-left:2px solid var(--l5)}

.mx-sug{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}

.mx-inp{display:flex;border:1px solid var(--g5);background:var(--surface)}

.mx-inp .btn{border:0}
.mx-txp .ssearch{margin-bottom:8px}

.mx-tb{position:fixed;left:max(20px,calc(50vw - 580px));right:max(20px,calc(50vw - 580px));bottom:20px;height:60px;border:1px solid var(--g5);display:flex;align-items:center;gap:16px;background:var(--surface);padding:0 14px;z-index:30}
.mx-pl{background:var(--ink);color:var(--bg);border:0;font:500 13px var(--sans);padding:6px 12px;cursor:pointer;white-space:nowrap}

.mx-tb .seekwrap{flex:1;min-width:0;height:22px}
.mx-tb .tm{font-size:12px;color:var(--ink-3);white-space:nowrap}
.mx-tx{font:500 13px var(--sans);border:1px solid var(--g5);background:none;padding:5px 10px;white-space:nowrap;cursor:pointer;color:var(--ink)}

html:not(.phone) body:has(.mx-tb) .pc-launch{display:none}   /* M6 has no ask bar: the talk has its own input, ⌘K still opens the planner */
.mx-cv.chat{border-top:0;margin:0;padding-top:0}
@media (max-width:1000px){.mx-bs{grid-template-columns:1fr}.mx-cv{border-left:0;padding-left:0;position:static;max-height:none}}
.mx-txp .stx{position:static;inset:auto;-webkit-mask-image:none;mask-image:none;scrollbar-width:thin}

.mx-txp .stx .tt{opacity:1;color:var(--ink-3)}

.mx-txp .ssearch button{color:var(--ink-2)}
.mx-tb .strip.seek{height:22px;border:0}
/* the folded planner chat is the M1 ask bar */

html:not(.phone) .pc-launch .pc-k{color:var(--ink-2);opacity:1;font-size:12px}
html:not(.phone) .pc-launch:hover{color:var(--ink);border-color:var(--ink)}

/* light / dark toggle in the header (Mac) */
header.top .themebtn{background:none;border:1px solid transparent;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2);padding:0;margin-left:6px;flex:none}
